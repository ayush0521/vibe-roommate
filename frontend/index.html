<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vr-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VibeRoommate – Find your perfect student roommate in tier-2 & tier-3 cities across India. Compatibility matching, PGs, hostels, and more." />
    <meta name="keywords" content="roommate, student housing, PG, hostel, India, compatibility, NIT, RGPV" />
    <meta name="author" content="VibeRoommate" />
    <meta property="og:title" content="VibeRoommate – Find Your Perfect Roommate" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Google Identity (for OAuth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('ServiceWorker registration successful with scope: ', reg.scope))
            .catch(err => console.log('ServiceWorker registration failed: ', err));
        });
      }
    </script>
    <title>VibeRoommate – Find Your Perfect Roommate</title>
